<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일 | To-Do</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 맨 위 바: 왼쪽 로고 글자 + 오른쪽 다크 모드 버튼 -->
  <header class="topbar">
    <div class="topbar-in">
      <span class="brand">CS Student</span>
      <button id="theme-btn" class="theme-btn" type="button" aria-label="화면 테마 전환">
        <span id="theme-icon">🌙</span><span id="theme-text">다크 모드</span>
      </button>
    </div>
  </header>

  <main class="wrap">

    <!-- 프로필 느낌의 소개 영역 -->
    <section class="hero">
      <div class="avatar">📝</div>
      <h1>오늘의 할 일</h1>
      <span class="badge" id="today">오늘</span>
      <p class="intro">해야 할 일을 적고, 체크하고, 달성률을 확인해 보세요.<br>새로고침해도 목록이 그대로 남아요.</p>
    </section>

    <!-- 현황 카드 3개 -->
    <section>
      <h2 class="sec">현황</h2>
      <div class="stats">
        <div class="stat"><div class="stat-icon">📋</div><b id="stat-all">0</b><span>전체</span></div>
        <div class="stat"><div class="stat-icon">🔥</div><b id="stat-active">0</b><span>진행중</span></div>
        <div class="stat"><div class="stat-icon">✅</div><b id="stat-done">0</b><span>완료</span></div>
      </div>
    </section>

    <!-- 할 일 영역 -->
    <section>
      <h2 class="sec">오늘의 목표</h2>
      <div class="panel">
        <p id="gauge-text" class="gauge-text"></p>
        <div class="gauge"><div id="gauge-bar"></div></div>

        <!-- Enter 키 또는 "추가" 버튼 둘 다 이 form이 처리 -->
        <form id="add-form" class="add-form" autocomplete="off">
          <input id="todo-input" type="text" maxlength="100" placeholder="할 일을 입력하고 Enter">
          <button id="add-btn" class="primary" type="submit">추가</button>
        </form>

        <div class="tabs">
          <button class="tab active" data-filter="all" type="button">전체</button>
          <button class="tab" data-filter="active" type="button">진행중</button>
          <button class="tab" data-filter="completed" type="button">완료</button>
        </div>

        <!-- render()가 이 목록을 다시 그려요 -->
        <ul id="todo-list" class="todo-list"></ul>

        <div class="foot">
          <span id="remain-count"></span>
          <button id="clear-done" class="link-btn" type="button">완료 항목 지우기</button>
        </div>
      </div>
    </section>

    <footer class="site-foot">© 2026 To-Do · 바이브 코딩 1주차 실습</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
